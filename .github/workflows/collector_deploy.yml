name: 야간선물 수집기 운영 연결
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collector-deploy
  cancel-in-progress: false
jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집기 배포와 실제 구독 승인 확인
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python3 deployment/deploy_collector.py
  website:
    needs: collector
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: tb-collector-${{ github.run_id }}
          restore-keys: |
            tb-cache-
            tb-collector-
      - name: 시세와 회원 상세 보존 후 사이트 배포
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV: real
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          python3 export_snapshot.py --cycles 1 --detail 60
          python3 export_snapshot_us.py --excd NAS,NYS,AMS --min-value 5
          python3 sync_snapshots.py --market both
          python3 export_detail_us.py --top 80
          python3 sync_snapshots.py --market both --require-details
          npx --yes wrangler@4.131.2 pages deploy --project-name theme-board --branch main --commit-dirty=true
