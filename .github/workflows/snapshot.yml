name: 테마보드 스냅샷 갱신

# ──────────────────────────────────────────────────────────────────────────
# GitHub 의 schedule 은 "최선을 다하지만 보장하지 않는" 방식이라
# */15 같은 잦은 주기는 대부분 무시된다(실측: 하루 28회 예상 → 실제 5회).
# 그래서 크론은 하루 몇 번만 쓰고, 실행된 작업 안에서 반복한다.
#
#   08:45 시작 → 루프 → (13:55 · 17:00 새 작업이 이어받음) → 20:00 종료
#   11:00 은 앞 작업이 누락됐을 때를 위한 예비 트리거
#
# 20:00 까지 도는 이유: 15:30~20:00 은 대체거래소(NXT) 애프터마켓이라
# 통합 시세가 계속 움직인다. 한 작업의 최대 실행시간이 6시간이므로
# 세 번에 나눠 이어받는다.
# ──────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "45 23 * * 0-4"    # KST 08:45  개장 전 시작
    - cron: "0 2 * * 1-5"      # KST 11:00  예비
    - cron: "55 4 * * 1-5"     # KST 13:55  후반 이어받기
    - cron: "0 8 * * 1-5"      # KST 17:00  시간외(NXT) 이어받기
  workflow_dispatch:
    inputs:
      interval:
        description: "갱신 간격(초)"
        required: false
        default: "600"
      until:
        description: "종료 시각 HHMM (KST)"
        required: false
        default: "2000"

# 새 작업이 뜨면 이전 작업을 끊고 이어받는다
concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 캐시 복원
        uses: actions/cache@v4
        with:
          path: .cache
          key: tb-cache-${{ github.run_id }}
          restore-keys: tb-cache-

      - name: 장중 반복 갱신
        env:
          KIS_APP_KEY:           ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:        ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV:               real
          DART_API_KEY:          ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID:       ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET:   ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERVAL: ${{ github.event.inputs.interval || '600' }}
          UNTIL:    ${{ github.event.inputs.until    || '2000' }}
        run: |
          echo "간격 ${INTERVAL}초 · ${UNTIL}(KST) 까지 · 시작 $(date '+%F %T')"
          # Full-site deploys must retain overseas JSON and member detail.
          python3 sync_snapshots.py --market both
          python3 export_detail_us.py --top 80
          n=0
          while : ; do
            n=$((n+1))
            echo "════════ ${n}회차  $(date '+%F %T') ════════"

            python3 export_snapshot.py --cycles 2 --detail 60 --ai --ai-top 30 \
              || echo "!! 스냅샷 실패 — 다음 회차로 넘어감"

            if python3 sync_snapshots.py --market kr --require-details; then
              python3 deployment/refresh_site.py || exit 1
              npx --yes wrangler@latest pages deploy \
                --project-name theme-board --branch main --commit-dirty=true \
                || echo "!! 배포 실패 — 다음 회차로 넘어감"
            else
              echo "!! 데이터 검증 실패 — 기존 운영 배포를 유지합니다"
            fi

            NOW=$(date +%H%M)
            if [ "$NOW" -ge "$UNTIL" ]; then
              echo "종료 시각(${UNTIL}) 도달 — ${n}회 갱신하고 마칩니다"
              break
            fi
            echo "다음 갱신까지 ${INTERVAL}초 대기 …"
            sleep "$INTERVAL"
          done
